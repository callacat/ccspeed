apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def localVersionName = project.hasProperty('versionName') ? versionName : '1.0.0'
// versionCode 由 CI 注入（-PversionCode=${{ github.run_number }}）保证每次构建递增，
// 否则同版本号覆盖安装会被 Android 拒绝；本地构建回退 1。
def ciVersionCode = project.hasProperty('versionCode')
        ? project.property('versionCode').toInteger()
        : 1

android {
    namespace 'com.callacat.ccspeed'
    compileSdk 34
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.callacat.ccspeed'
        minSdk 33
        targetSdk 34
        versionCode ciVersionCode
        // versionName 由 CI 注入（-PversionName=$GITHUB_REF_NAME），本地构建回退 1.0.0
        versionName project.hasProperty('versionName') ? versionName : '1.0.0'
        // 关键：二进制走 jniLibs 而非 assets → filesDir exec。Android 10+
        // SELinux 禁止 untrusted_app 执行 app_data_file 上的可执行文件
        //（run 44984072424 见 execute_no_trans denied），但允许 nativeLibraryDir
        // 下直接 exec（v2rayNG/Xray 同款姿势）。两套 ABI：
        // arm64-v8a（真机）+ x86_64（AVD），文件名都以 lib 打头写成 libccspeed.so，
        // 否则 installer 不抽取到 nativeLibraryDir。
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    aaptOptions {
        // 不压缩，安装器直接解压到 lib/<abi>/
        noCompress 'libccspeed.so', 'libhev-socks5-tunnel.so'
    }

    packaging {
        jniLibs {
            // 必须显式开启 legacy packaging，否则 AGP 8.x 会拒绝把 libccspeed.so 抽取到 nativeLibraryDir
            //（报错: "jniLibs.useLegacyPackaging=false but libccspeed.so is not a standard JNI library"）
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        debug {
            // 固定 debug keystore 随仓库提交：内部分发用，跨 CI 构建签名一致，
            // 用户可 -r 覆盖升级而无需卸载。口令即 Android 惯例 debug 口令，无安全代价。
            storeFile rootProject.file('keystore/ccspeed-debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "VERSION_NAME", "\"${localVersionName}\""
        }
        release {
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "VERSION_NAME", "\"${localVersionName}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
}