apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.callacat.ccspeed'
    compileSdk 34

    defaultConfig {
        applicationId 'com.callacat.ccspeed'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // 关键：把内嵌 ELF 放进 jniLibs 而非 assets。Android 10+ SELinux 禁止 untrusted_app 执行
    // app_data_file 上的文件，但允许 nativeLibraryDir（/data/app/.../lib/<abi>/）下执行。
    // 两套 ABI：arm64-v8a（真机）+ x86_64（AVD），名字统一为 ccspeed（无后缀），
    // 运行时按 Build.SUPPORTED_ABIS 从 nativeLibraryDir 取对应目录下的 ccspeed。
    ndk {
        abiFilters 'arm64-v8a', 'x86_64'
    }
    aaptOptions {
        noCompress 'ccspeed'  // 不压缩，安装器直接解压到 lib/<abi>/
    }

    signingConfigs {
        debug {
            // CI 里用环境变量里的 debug keystore（不存在时用 AGP 自动生成的 ~/.android）
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // assets 里躺两个未压缩 ELF（~5.5MB arm64 + ~6.8MB amd64），默认压缩会让解压读盘变慢；
    // 只是解压不走 zip 解压器，跳过压缩省一次 IO。
    androidResources {
        noCompress 'ccspeed-linux-arm64', 'ccspeed-linux-amd64'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}