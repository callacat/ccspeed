name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  build:
    needs: vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            out: ccspeed-windows-amd64.exe
          - goos: linux
            goarch: amd64
            out: ccspeed-linux-amd64
          - goos: linux
            goarch: arm64
            out: ccspeed-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/${{ matrix.out }}" .
          sha256sum "dist/${{ matrix.out }}" | tee "dist/${{ matrix.out }}.sha256"
          file "dist/${{ matrix.out }}"
          grep -Eq '9f89-3bf6d9de5903|4tGzDojrPnvDAMNWFIAx5R' main.go secrets.go web.go || echo "secrets clean"

  android:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify embedded binaries (sha256 对拍)
        run: |
          set -e
          # jniLibs 里的 ccspeed 是 APK installer 会解压到 nativeLibraryDir 的 ELF（selinux 只允许在该处 exec）；hev 是 ATM JNI 库。
          for f in \
            android/app/src/main/jniLibs/arm64-v8a/libccspeed.so \
            android/app/src/main/jniLibs/x86_64/libccspeed.so \
            android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so \
            android/app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so; do
            sha256sum "$f"
          done
          # APK 不带凭据：Release 产物默认 credentials 为空（main.go 的 defaultAPIAuth 空串），
          # 这里只把显式写进二进制显然易见的形状掐掉。
          if grep -aoE 'CC_AUTH=[A-Za-z0-9_-]{16,}|CC_COMM=[A-Za-z0-9_-]{16,}' \
               android/app/src/main/jniLibs/*/libccspeed.so; then
            echo "FATAL: jniLibs 命中凭据形状"; exit 1
          fi
          echo "jniLibs secrets clean"
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: List APK
        working-directory: android
        run: ls -la app/build/outputs/apk/debug/
      # upload-artifact 走不通：账号 artifact 存储配额打满（10-13 起就这状态，
      # usage recalculated every 6-12 hours 都不够）。APK 交付改走 release job
      # 的 gh release create（Release 附件与 artifact 是两套配额），push-only run
      # 里只保留「构建 + 列产物」当证据，CI 绿不再卡在 upload 动作上。
      - name: SHA256 APK
        working-directory: android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

  # 真机 192.168.1.157 暂不可达 ⇒ 装机验收降级到 CI 内 AVD。
  # GitHub ubuntu runner 自带 KVM 硬件加速；API 34 / x86_64 google_apis 镜像
  # 上 installer 抽取 jniLibs/x86_64/libccspeed.so 到 nativeLibraryDir，SELinux
  # 允许 untrusted_app 在 nativeLibraryDir 直接 exec。真机回归项单列在 README。
  android-emulator:
    needs: [vet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          set -e
          grep -qE '(vmx|svm)' /proc/cpuinfo
          # ubuntu-latest 自带嵌套虚拟化权限；补一遍 group 只是让 action 少一次探活失败
          sudo chown $USER /dev/kvm

      - name: Run AVD (API 34 / x86_64 / google_apis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -no-window -no-boot-anim -noaudio -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: android
          script: |
            set -e
            chmod +x avd-verify.sh
            # 真机 192.168.1.157 暂不可达 ⇒ 装机验收降级到 CI 内 AVD。
            # 详细探针、授权链 tap、logcat 判据见 android/avd-verify.sh。
            bash avd-verify.sh

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Cross-build all targets
        run: |
          set -e
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 out=$3
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags='-s -w' -o "dist/$out" .
            sha256sum "dist/$out" | tee "dist/$out.sha256"
            file "dist/$out"
          }
          build windows amd64 ccspeed-windows-amd64.exe
          build linux   amd64 ccspeed-linux-amd64
          build linux   arm64 ccspeed-linux-arm64
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "${{ github.ref_name }}" \
            --title "ccspeed ${{ github.ref_name }}" \
            --notes "$(printf 'ccspeed %s\n\n- Web 控制台 + 内嵌 UI（凭据 / 选节点 / 日志 / SOCKS5 鉴权）\n- 纯 Go stdlib，零第三方依赖；CGO_ENABLED=0 静态构建\n- Android 薄壳 APK（Kotlin + VpnService + 内嵌 ccspeed-linux-arm64 + hev-socks5-tunnel）\n- 二进制未经代码签名，Windows SmartScreen 首次会拦（见 README §6）\n' "${{ github.ref_name }}")" \
            dist/ccspeed-windows-amd64.exe \
            dist/ccspeed-windows-amd64.exe.sha256 \
            dist/ccspeed-linux-amd64 \
            dist/ccspeed-linux-amd64.sha256 \
            dist/ccspeed-linux-arm64 \
            dist/ccspeed-linux-arm64.sha256 \
            android/app/build/outputs/apk/debug/app-debug.apk