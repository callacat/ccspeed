name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  build:
    needs: vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            out: ccspeed-windows-amd64.exe
          - goos: linux
            goarch: amd64
            out: ccspeed-linux-amd64
          - goos: linux
            goarch: arm64
            out: ccspeed-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            VERSION="dev-${{ github.sha::8 }}"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/${{ matrix.out }}" .
          sha256sum "dist/${{ matrix.out }}" | tee "dist/${{ matrix.out }}.sha256"
          file "dist/${{ matrix.out }}"
          grep -Eq '9f89-3bf6d9de5903|4tGzDojrPnvDAMNWFIAx5R' main.go secrets.go web.go || echo "secrets clean"

  android:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify embedded binaries (sha256 check)
        run: |
          set -e
          for f in \
            android/app/src/main/jniLibs/arm64-v8a/libccspeed.so \
            android/app/src/main/jniLibs/x86_64/libccspeed.so \
            android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so \
            android/app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so; do
            sha256sum "$f"
          done
          if grep -aoE 'CC_AUTH=[A-Za-z0-9_-]{16,}|CC_COMM=[A-Za-z0-9_-]{16,}' \
               android/app/src/main/jniLibs/*/libccspeed.so; then
            echo "FATAL: jniLibs credential shape detected"; exit 1
          fi
          echo "jniLibs secrets clean"
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionName=${{ github.ref_name }}
      - name: List APK
        working-directory: android
        run: ls -la app/build/outputs/apk/debug/
      - name: SHA256 APK
        working-directory: android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
