name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go mod tidy
        run: go mod tidy
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt issues (non-blocking):"; echo "$out"; fi

  build:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go mod tidy
        run: go mod tidy
      - name: Build linux amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -e
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            VERSION="dev-${{ github.sha }}"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/ccspeed-linux-amd64" .
          sha256sum "dist/ccspeed-linux-amd64" | tee "dist/ccspeed-linux-amd64.sha256"
          file "dist/ccspeed-linux-amd64"
          grep -Eq '9f89-3bf6d9de5903|4tGzDojrPnvDAMNWFIAx5R' main.go secrets.go web.go || echo "secrets clean"
      - name: Build linux arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          set -e
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            VERSION="dev-${{ github.sha }}"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/ccspeed-linux-arm64" .
          sha256sum "dist/ccspeed-linux-arm64" | tee "dist/ccspeed-linux-arm64.sha256"
          file "dist/ccspeed-linux-arm64"
          grep -Eq '9f89-3bf6d9de5903|4tGzDojrPnvDAMNWFIAx5R' main.go secrets.go web.go || echo "secrets clean"
      - name: Build windows amd64
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -e
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            VERSION="dev-${{ github.sha }}"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/ccspeed-windows-amd64.exe" .
          sha256sum "dist/ccspeed-windows-amd64.exe" | tee "dist/ccspeed-windows-amd64.exe.sha256"
          file "dist/ccspeed-windows-amd64.exe"
          grep -Eq '9f89-3bf6d9de5903|4tGzDojrPnvDAMNWFIAx5R' main.go secrets.go web.go || echo "secrets clean"

  android:
    needs: [vet, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Android libccspeed.so (arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libccspeed.so .
          sha256sum android/app/src/main/jniLibs/arm64-v8a/libccspeed.so
      - name: Build Android libccspeed.so (x86_64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o android/app/src/main/jniLibs/x86_64/libccspeed.so .
          sha256sum android/app/src/main/jniLibs/x86_64/libccspeed.so
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify embedded binaries (sha256 check)
        run: |
          set -e
          for f in \
            android/app/src/main/jniLibs/arm64-v8a/libccspeed.so \
            android/app/src/main/jniLibs/x86_64/libccspeed.so \
            android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so \
            android/app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so; do
            sha256sum "$f"
          done
          if grep -aoE 'CC_AUTH=[A-Za-z0-9_-]{16,}|CC_COMM=[A-Za-z0-9_-]{16,}' \
               android/app/src/main/jniLibs/*/libccspeed.so; then
            echo "FATAL: jniLibs credential shape detected"; exit 1
          fi
          echo "jniLibs secrets clean"
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionName=${{ github.ref_name }} -PversionCode=${{ github.run_number }}
      - name: List APK
        working-directory: android
        run: ls -la app/build/outputs/apk/debug/
      - name: SHA256 APK
        working-directory: android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signing + versionCode
        working-directory: android
        env:
          # 入库 debug keystore (android/keystore/ccspeed-debug.jks) 证书指纹；
          # 断言每次 CI 签名一致，杜绝回退到 AGP 随机 debug keystore。
          EXPECTED_CERT_SHA256: A3157B644F25628B12DB1EA6E83D26B6FF3096FCD4D246FCFE878E30DAF31F42
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          GOT=$("$BT/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "apk cert SHA-256 : $GOT"
          echo "expected (fixed) : $EXPECTED_CERT_SHA256"
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "FATAL: APK 未用固定 debug keystore 签名，跨次构建将 cannot-update"; exit 1; }
          "$BT/aapt" dump badging "$APK" | grep -E '^package:'
          VC=$("$BT/aapt" dump badging "$APK" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "apk versionCode  : $VC"
          [ -n "$VC" ] && [ "$VC" -gt 1 ] || { echo "FATAL: versionCode 未由 CI 注入 (got '$VC')"; exit 1; }
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  android-emulator:
    needs: [vet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionName=${{ github.ref_name }} -PversionCode=${{ github.run_number }}
      - name: Enable KVM
        run: |
          set -e
          grep -qE '(vmx|svm)' /proc/cpuinfo
          sudo chown $USER /dev/kvm
      - name: Run AVD (API 34 / x86_64 / google_apis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -no-window -no-boot-anim -noaudio -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: android
          script: |
            set -e
            chmod +x avd-verify.sh
            bash avd-verify.sh

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionName=${{ github.ref_name }} -PversionCode=${{ github.run_number }}
      - name: SHA256 APK (release)
        working-directory: android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Cross-build all targets
        run: |
          set -e
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          build() {
            local goos=$1 goarch=$2 out=$3
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/$out" .
            sha256sum "dist/$out" | tee "dist/$out.sha256"
            file "dist/$out"
          }
          build windows amd64 ccspeed-windows-amd64.exe
          build linux   amd64 ccspeed-linux-amd64
          build linux   arm64 ccspeed-linux-arm64
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "ccspeed $TAG" > /tmp/release_notes.txt
          echo "" >> /tmp/release_notes.txt
          echo "- Web console + embedded UI (credentials / node select / logs / SOCKS5 auth)" >> /tmp/release_notes.txt
          echo "- Pure Go stdlib, zero third-party deps; CGO_ENABLED=0 static build" >> /tmp/release_notes.txt
          echo "- Android thin-shell APK (Kotlin + VpnService + embedded ccspeed-linux-arm64 + hev-socks5-tunnel)" >> /tmp/release_notes.txt
          echo "- Binaries unsigned, Windows SmartScreen blocks first run (see README section 6)" >> /tmp/release_notes.txt
          gh release create "$TAG" \
            --title "ccspeed $TAG" \
            --notes-file /tmp/release_notes.txt \
            dist/ccspeed-windows-amd64.exe \
            dist/ccspeed-windows-amd64.exe.sha256 \
            dist/ccspeed-linux-amd64 \
            dist/ccspeed-linux-amd64.sha256 \
            dist/ccspeed-linux-arm64 \
            dist/ccspeed-linux-arm64.sha256 \
            android/app/build/outputs/apk/debug/app-debug.apk