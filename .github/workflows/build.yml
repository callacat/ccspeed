name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  build:
    needs: vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            out: ccspeed-windows-amd64.exe
          - goos: linux
            goarch: amd64
            out: ccspeed-linux-amd64
          - goos: linux
            goarch: arm64
            out: ccspeed-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/${{ matrix.out }}" .
          sha256sum "dist/${{ matrix.out }}" | tee "dist/${{ matrix.out }}.sha256"
          file "dist/${{ matrix.out }}"
          grep -Eq '9f89-3bf6d9de5903|4tGzDojrPnvDAMNWFIAx5R' main.go secrets.go web.go || echo "secrets clean"

  android:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify embedded binaries (sha256 对拍)
        run: |
          set -e
          # assets 里的 ccspeed 必须与 v1.0.1 Release 一致；jniLibs 里的 hev 必须与本 run 一致。
          sha256sum android/app/src/main/assets/ccspeed-linux-arm64
          sha256sum android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          # APK 不带凭据：Release 产物默认 credentials 为空（main.go 的 defaultAPIAuth 空串），
          # 这里只把显式写进二进制显然易见的形状掐掉。
          if grep -aoE 'CC_AUTH=[A-Za-z0-9_-]{16,}|CC_COMM=[A-Za-z0-9_-]{16,}' \
               android/app/src/main/assets/ccspeed-linux-arm64; then
            echo "FATAL: assets 命中凭据形状"; exit 1
          fi
          echo "assets secrets clean"
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: List APK
        working-directory: android
        run: ls -la app/build/outputs/apk/debug/
      # upload-artifact 走不通：账号 artifact 存储配额打满（10-13 起就这状态，
      # usage recalculated every 6-12 hours 都不够）。APK 交付改走 release job
      # 的 gh release create（Release 附件与 artifact 是两套配额），push-only run
      # 里只保留「构建 + 列产物」当证据，CI 绿不再卡在 upload 动作上。
      - name: SHA256 APK
        working-directory: android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Cross-build all targets
        run: |
          set -e
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 out=$3
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags='-s -w' -o "dist/$out" .
            sha256sum "dist/$out" | tee "dist/$out.sha256"
            file "dist/$out"
          }
          build windows amd64 ccspeed-windows-amd64.exe
          build linux   amd64 ccspeed-linux-amd64
          build linux   arm64 ccspeed-linux-arm64
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "${{ github.ref_name }}" \
            --title "ccspeed ${{ github.ref_name }}" \
            --notes "$(printf 'ccspeed %s\n\n- Web 控制台 + 内嵌 UI（凭据 / 选节点 / 日志 / SOCKS5 鉴权）\n- 纯 Go stdlib，零第三方依赖；CGO_ENABLED=0 静态构建\n- Android 薄壳 APK（Kotlin + VpnService + 内嵌 ccspeed-linux-arm64 + hev-socks5-tunnel）\n- 二进制未经代码签名，Windows SmartScreen 首次会拦（见 README §6）\n' "${{ github.ref_name }}")" \
            dist/ccspeed-windows-amd64.exe \
            dist/ccspeed-windows-amd64.exe.sha256 \
            dist/ccspeed-linux-amd64 \
            dist/ccspeed-linux-amd64.sha256 \
            dist/ccspeed-linux-arm64 \
            dist/ccspeed-linux-arm64.sha256 \
            android/app/build/outputs/apk/debug/app-debug.apk