name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  build:
    needs: vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            out: ccspeed-windows-amd64.exe
          - goos: linux
            goarch: amd64
            out: ccspeed-linux-amd64
          - goos: linux
            goarch: arm64
            out: ccspeed-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/${{ matrix.out }}" .
          sha256sum "dist/${{ matrix.out }}" | tee "dist/${{ matrix.out }}.sha256"
          file "dist/${{ matrix.out }}"
          grep -Eq '9f89-3bf6d9de5903|4tGzDojrPnvDAMNWFIAx5R' main.go secrets.go web.go || echo "secrets clean"

  android:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify embedded binaries (sha256 对拍)
        run: |
          set -e
          # assets 里的 ccspeed 必须与 v1.0.1 Release 一致；jniLibs 里的 hev 必须与本 run 一致。
          sha256sum android/app/src/main/assets/ccspeed-linux-arm64
          sha256sum android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          # APK 不带凭据：Release 产物默认 credentials 为空（main.go 的 defaultAPIAuth 空串），
          # 这里只把显式写进二进制显然易见的形状掐掉。
          if grep -aoE 'CC_AUTH=[A-Za-z0-9_-]{16,}|CC_COMM=[A-Za-z0-9_-]{16,}' \
               android/app/src/main/assets/ccspeed-linux-arm64; then
            echo "FATAL: assets 命中凭据形状"; exit 1
          fi
          echo "assets secrets clean"
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: List APK
        working-directory: android
        run: ls -la app/build/outputs/apk/debug/
      # upload-artifact 走不通：账号 artifact 存储配额打满（10-13 起就这状态，
      # usage recalculated every 6-12 hours 都不够）。APK 交付改走 release job
      # 的 gh release create（Release 附件与 artifact 是两套配额），push-only run
      # 里只保留「构建 + 列产物」当证据，CI 绿不再卡在 upload 动作上。
      - name: SHA256 APK
        working-directory: android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

  # 真机 192.168.1.157 暂不可达 ⇒ 装机验收降级到 CI 内 AVD。
  # GitHub ubuntu runner 自带 KVM 硬件加速；API 34 + x86_64 镜像恰好能
  # exec GOOS=linux GOARCH=amd64 的 ccspeed（AVD 无 ARM 转译层；amba64 壳里
  # 只放 arm64 ELF 会 exec format error）。真机回归项单列在 README。
  android-emulator:
    needs: [vet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          set -e
          grep -qE '(vmx|svm)' /proc/cpuinfo
          # ubuntu-latest 自带嵌套虚拟化权限；补一遍 group 只是让 action 少一次探活失败
          sudo chown $USER /dev/kvm

      - name: Run AVD (API 34 / x86_64 / google_apis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -no-window -no-boot-anim -noaudio -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: android
          script: |
            set -e
            echo "=== adb devices ==="
            adb devices
            echo "=== install APK ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "=== launch ==="
            adb shell am start -n com.callacat.ccspeed/.MainActivity
            sleep 5
            echo "=== tap 启动 → 触发 VpnService.prepare 弹窗 ==="
            # MainActivity 首屏三个 View：状态 TextView + 启动 Button + 控制台 Button。
            # 用 uiautomator dump 拿坐标比硬编码稳，但 AVD 默认 480dp 宽最简做法是
            # dump 后 awk 解「启动」bounds。这里直接 dump + 取第一个 Button 中心点。
            adb shell uiautomator dump /sdcard/ui.xml
            adb pull /sdcard/ui.xml /tmp/ui.xml
            python3 - <<'PY'
            import re, subprocess, sys
            xml = open('/tmp/ui.xml').read()
            m = re.search(r'text="启动"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
            if not m:
                sys.exit("未找到「启动」按钮 bounds")
            x = (int(m.group(1)) + int(m.group(3))) // 2
            y = (int(m.group(2)) + int(m.group(4))) // 2
            print(f"tap 启动 at ({x},{y})")
            subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
            PY
            sleep 3
            echo "=== tap 系统授权对话框的「确定」 ==="
            adb shell uiautomator dump /sdcard/ui2.xml
            adb pull /sdcard/ui2.xml /tmp/ui2.xml
            python3 - <<'PY'
import re, subprocess, sys
xml = open('/tmp/ui2.xml').read()
# AOSP 授权对话框按钮文案随 locale，x86_64 google_apis 镜像是英文：OK
for txt in ("OK", "确定", "允许", "Allow"):
    m = re.search(rf'text="{txt}"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
    if m:
        x = (int(m.group(1)) + int(m.group(3))) // 2
        y = (int(m.group(2)) + int(m.group(4))) // 2
        print(f"tap {txt} at ({x},{y})")
        subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
        sys.exit(0)
print("未找到授权按钮——可能弹窗文案变化，退回直接起 service")
subprocess.run(["adb", "shell", "am", "start-foreground-service",
                "-n", "com.callacat.ccspeed/.CcspeedVpnService"], check=True)
PY
            sleep 10
            echo "=== banner / ABI / TUN 判据 ==="
            adb logcat -d -s ccspeed-runtime:I ccspeed-vpn:I ccspeed-main:I | tail -80
            echo "=== 进程 / TUN 存活 ==="
            adb shell "ps -A | grep -E 'ccspeed|hev' || true"
            adb shell "ip -o addr show tun0 || true"
            echo "=== SOCKS5 127.0.0.1:1081 端口在听（0x0439）==="
            adb shell "(cat /proc/net/tcp | grep -i ':0439' || true)"
            echo "=== Web 控制台 127.0.0.1:28981 应答 ==="
            adb shell "curl -s -o /dev/null -w 'http=%{http_code}\n' http://127.0.0.1:28981/"
            echo "=== TUN 生效（curl 经壳出）==="
            adb shell "curl -s --max-time 15 https://ifconfig.me || true"
            echo "=== 停止：service 停、native 退、端口释放 ==="
            adb shell am stopservice -n com.callacat.ccspeed/.CcspeedVpnService
            sleep 4
            adb shell "ps -A | grep -E 'ccspeed|hev' || echo 'no ccspeed/hev process'"
            adb shell "ip -o addr show tun0 || echo 'tun0 gone'"
            echo "=== APK assets 零凭据复核 ==="
            APK_PATH="$(adb shell pm path com.callacat.ccspeed | head -1 | sed 's/^package://' | tr -d '\r')"
            echo "apk=$APK_PATH"
            # zipalign noCompress of ccspeed ELFs still strings-able after pull
            adb pull "$APK_PATH" /tmp/installed.apk
            HIT=$(python3 -c "
            import re,sys
            data=open('/tmp/installed.apk','rb').read()
            hits=re.findall(rb'CC_AUTH=[A-Za-z0-9_-]{16,}|CC_COMM=[A-Za-z0-9_-]{16,}',data)
            print(len(hits))
            ")
            echo "credential-shape hits in APK = $HIT"
            [ "$HIT" = "0" ] || { echo 'FATAL: APK 命中凭据形状'; exit 1; }
            echo "=== adb install / logcat 全过则 gate 通过 ==="

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Cross-build all targets
        run: |
          set -e
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 out=$3
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags='-s -w' -o "dist/$out" .
            sha256sum "dist/$out" | tee "dist/$out.sha256"
            file "dist/$out"
          }
          build windows amd64 ccspeed-windows-amd64.exe
          build linux   amd64 ccspeed-linux-amd64
          build linux   arm64 ccspeed-linux-arm64
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "${{ github.ref_name }}" \
            --title "ccspeed ${{ github.ref_name }}" \
            --notes "$(printf 'ccspeed %s\n\n- Web 控制台 + 内嵌 UI（凭据 / 选节点 / 日志 / SOCKS5 鉴权）\n- 纯 Go stdlib，零第三方依赖；CGO_ENABLED=0 静态构建\n- Android 薄壳 APK（Kotlin + VpnService + 内嵌 ccspeed-linux-arm64 + hev-socks5-tunnel）\n- 二进制未经代码签名，Windows SmartScreen 首次会拦（见 README §6）\n' "${{ github.ref_name }}")" \
            dist/ccspeed-windows-amd64.exe \
            dist/ccspeed-windows-amd64.exe.sha256 \
            dist/ccspeed-linux-amd64 \
            dist/ccspeed-linux-amd64.sha256 \
            dist/ccspeed-linux-arm64 \
            dist/ccspeed-linux-arm64.sha256 \
            android/app/build/outputs/apk/debug/app-debug.apk